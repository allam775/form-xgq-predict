name: Penniless draw calibration and draw-risk research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/draw_lab.py'
      - 'engine/comprehensive.py'
      - 'tests/test_draw_lab.py'
      - '.github/workflows/draw-lab.yml'
permissions:
  contents: read
concurrency:
  group: penniless-draw-lab
  cancel-in-progress: false
jobs:
  draw-research:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test normalization, regression, draw-watch and chronology
        run: python -m unittest discover -s tests -p 'test_draw_lab.py' -v
      - name: Research draw calibration on all eligible verified historical matches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.draw_lab
