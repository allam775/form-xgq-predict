name: Reconcile eight rejected 365Scores matches with individual player match stats
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/player_shot_witness365.py'
      - 'research/365_eight_player_witness.py'
      - 'tests/test_365_player_shot_witness.py'
      - 'tests/test_365_eight_player_witness.py'
      - '.github/workflows/365-eight-player-witness.yml'
permissions:
  contents: read
concurrency:
  group: 365scores-original-eight-player-reconciliation
  cancel-in-progress: false
jobs:
  private-player-stat-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test player shot/xG attribution with no live provider calls
        run: |
          python -m unittest discover -s tests -p 'test_365_player_shot_witness.py' -v
          python -m unittest discover -s tests -p 'test_365_eight_player_witness.py' -v
      - name: Check eight matches against original 365Scores individual player statistics privately
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_eight_player_witness
      - name: Validate source and player privacy gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/365_eight_player_witness.json').read_text())
          assert r['provider_requests']<=r['request_cap']<=8
          assert r['match_promotions']==0
          assert r['player_id_public'] is False
          assert r['individual_xg_public'] is False
          assert r['provider_match_id_public'] is False
          assert r['raw_shots_written'] is False
          assert r['training_modified'] is False
          print('Player-level witness is private; incomplete XGQ not promoted')
          PY
      - name: Upload anonymized eight-match aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-365scores-eight-player-reconciliation
          path: research/reports/365_eight_player_witness.json
          retention-days: 7
          if-no-files-found: warn
