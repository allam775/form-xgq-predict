name: Diagnose eleven rejected 365Scores historical matches
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/365-rejected-diagnosis.yml'
permissions:
  contents: read
concurrency:
  group: 365scores-eleven-rejected-diagnosis
  cancel-in-progress: false
jobs:
  diagnose-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax plus zero-network privacy regression
        run: |
          python -m py_compile research/365_rejected_diagnosis.py
          python -m unittest discover -s tests -p 'test_365_rejected_diagnosis.py' -v
      - name: Inspect ONLY eleven rejected D1 matches and four accepted controls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_rejected_diagnosis
      - name: Check no private individual xG or match records published
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/reports/365_rejected_diagnosis_summary.json').read_text())
          assert x['raw_events_written']==0
          assert x['event_sequences_written']==0
          assert x['match_id_published'] is False
          assert x['verified_archive_changed'] is False
          assert x.get('cases_examined',0)<=15
          assert x.get('details_requested',0)+x.get('stats_requested',0)<=30
          assert 'matches' not in x and 'match_ids' not in x
          print('One-time private diagnosis summary passed privacy/limit contract')
          PY
      - name: Upload aggregate diagnostic counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-eleven-rejections-diagnostic
          path: research/reports/365_rejected_diagnosis_summary.json
          retention-days: 3
          if-no-files-found: warn
