name: Recompute UEFA Champions League projection after each completed matchday
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/ucl_daily_refresh.py'
      - 'tests/test_ucl_daily_refresh.py'
      - '.github/workflows/ucl-daily-refresh.yml'
  schedule:
    # Each European matchday's results usually complete before 00:15 UTC.
    # Three catch-up checks without changing immutable prior snapshots.
    - cron: '17 0,3,6 * * *'
permissions:
  contents: read
concurrency:
  group: penniless-ucl-after-each-day-projection
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      XGQ_365_ACCESS_AUTHORIZED: '1'
      XGQ_365_PRIVATE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard original predictions, real fixtures and final-result certification
        run: |
          python -m unittest discover -s tests -p 'test_ucl_daily_refresh.py' -v
          python -m unittest discover -s tests -p 'test_ucl_grade_daily.py' -v
      - name: Fetch bounded authorized 365Scores UCL match finals, refresh verified past-day Elo and simulate remaining tournament
        run: python -m research.ucl_daily_refresh
      - name: Grade pre-kickoff frozen continental model suite from certified official match finishes
        run: python -m research.ucl_forward grade
