name: Penniless real multi-source sample matrix
on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 3'
  push:
    branches: [main]
    paths:
      - 'research/penniless_multisource_samples.py'
      - 'tests/test_penniless_multisource_samples.py'
      - '.github/workflows/penniless-real-sample-matrix.yml'
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify provider guardrails with synthetic offline tests
        run: python -m unittest discover -s tests -p 'test_penniless_multisource_samples.py' -v
      - name: Sample REAL sources with no paid APIs; report only safe summaries
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.penniless_multisource_samples
      - name: Upload only safe provider-specific sample summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penniless-real-source-samples
          path: research/reports/penniless_sample_matrix.json
          if-no-files-found: warn
          retention-days: 7
