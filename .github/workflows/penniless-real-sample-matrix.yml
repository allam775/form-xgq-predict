name: Penniless real multi-source sample matrix
on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 3'
  push:
    branches: [main]
    paths:
      - 'research/penniless_multisource_samples.py'
      - 'tests/test_penniless_multisource_samples.py'
      - '.github/workflows/penniless-real-sample-matrix.yml'
permissions:
  contents: write
concurrency:
  group: penniless-real-multisource-sample
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify provider guardrails with synthetic offline tests
        run: python -m unittest discover -s tests -p 'test_penniless_multisource_samples.py' -v
      - name: Sample REAL sources with no paid APIs; report only safe summaries
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.penniless_multisource_samples
      - name: Upload only safe provider-specific sample summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penniless-real-source-samples
          path: research/reports/penniless_sample_matrix.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain latest sanitized audit, safely retrying concurrent updates
        if: success()
        run: |
          cp research/reports/penniless_sample_matrix.json "$RUNNER_TEMP/penniless-report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            # No rebasing generated JSON: a concurrent refresh can change every line.
            # Do not replace a newer published sample with an older runner report.
            python - <<'PY'
          import json,os,pathlib
          source=pathlib.Path(os.environ["RUNNER_TEMP"])/"penniless-report.json"
          target=pathlib.Path("research/reports/penniless_sample_matrix.json")
          new=json.loads(source.read_text())
          try:
              old=json.loads(target.read_text())
          except (OSError,ValueError):
              old={}
          if old.get("created_at_utc","") > new.get("created_at_utc",""):
              print("A fresher report is already in the repository.")
          else:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(source.read_text())
          PY
            git add research/reports/penniless_sample_matrix.json
            if git diff --cached --quiet; then
              echo "Already published or newer report retained"
              exit 0
            fi
            git commit -m "research: refresh sanitized seven-source sample audit"
            if git push origin HEAD:main; then
              echo "Source audit published"
              exit 0
            fi
            sleep "$attempt"
          done
          echo "All bounded publish retries failed"
          exit 1
