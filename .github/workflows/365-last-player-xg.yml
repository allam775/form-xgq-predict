name: Resolve final 365Scores player xG discrepancy without guessing shots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alternate_player_shot_xg365.py'
      - 'research/365_last_player_xg_investigation.py'
      - 'tests/test_365_alternate_player_xg.py'
      - '.github/workflows/365-last-player-xg.yml'
permissions:
  contents: read
jobs:
  private-last-shot-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no fabricated xG or unspecified alternative metrics
        run: python -m unittest discover -s tests -p 'test_365_alternate_player_xg.py' -v
      - name: Recheck just one original xG-only conflict privately
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_last_player_xg_investigation
      - name: Privacy and fail-closed proof audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/365_last_player_xg_investigation.json').read_text())
          assert r['provider_requests']<=1
          assert r['training_release'] is False
          assert r['original_audit_preserved'] is True
          assert r['raw_events_written'] is False
          assert r['public_player_identifiers'] is False
          assert r['public_match_identifiers'] is False
          print('Only explicit existing individual xG alternatives may qualify')
          PY
      - name: Upload no-private-data summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-last-player-alternate-xg-proof
          path: research/reports/365_last_player_xg_investigation.json
          retention-days: 7
          if-no-files-found: warn
