name: Project the entire 2026-27 UEFA Champions League
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgq-ucl2027-standalone-research
  cancel-in-progress: false
jobs:
  project-season:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress no forced winner-only scoreline, honest draws and Poisson score distribution
        run: python -m unittest discover -s tests -p 'test_ucl_scoreline.py' -v
      - name: Verify all actual UEFA fixtures and complete balanced Swiss phase
        run: |
          python - <<'PY'
          from research.ucl_2026_27 import fixtures,TEAM_NAMES
          data=fixtures()
          assert len(data)==144 and len(TEAM_NAMES)==36
          assert len([x for x in data if x['actual']])==18
          assert len([x for x in data if not x['actual']])==126
          print('UEFA 144 match schedule checked for 36 teams and 4H/4A balance')
          PY
      - name: Project goal scorelines and calculate full 36-team league table plus knockout title odds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m research.ucl_2026_27
      - name: Verify probabilities and UEFA 36-table, playoff bracket and 6k tournament simulations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/ucl2026_27/ucl_2026_27_results.json').read_text())
          assert len(r['matches'])==144 and len(r['league_table'])==36
          assert len(set(x['team'] for x in r['league_table']))==36
          assert all(r['matches'][i]['status']=='ACTUAL' for i in range(18))
          assert sum(x['status']=='PREDICTION' for x in r['matches'])==126
          assert len(r['expected_league_table'])==36
          assert all(x['scoreline_method']=='ONE_SEEDED_RANDOM_REALIZATION'
                     for x in r['matches'] if x['status']=='PREDICTION')
          assert all(len(x['top_scorelines'])==5 and
                     x['top_scorelines'][0]['scoreline']==x['modal_scoreline']
                     and abs(x['top_scorelines'][0]['probability']-x['modal_score_probability'])<1e-6
                     and x['scenario_scoreline']==x['scoreline']
                     for x in r['matches'] if x['status']=='PREDICTION')
          assert all(len(x['top_scorelines'])==0 and x['score_probability'] is None
                     for x in r['matches'] if x['status']=='ACTUAL')
          assert all(sum(y['probability'] for y in x['top_scorelines'])<=1.00001
                     for x in r['matches'] if x['status']=='PREDICTION')
          assert sum(z['expected_points'] for z in r['expected_league_table'])>300
          assert r['scoreline_diagnostics']['sum_draw_probabilities']>15
          assert r['scoreline_diagnostics']['sampled_draw_count']>0
          assert len(r['scoreline_diagnostics']['future_one_sample_score_counts'])>=10
          assert all(abs(x['home_probability']+x['draw_probability']+x['away_probability']-1)<3e-6 for x in r['matches'] if x['status']=='PREDICTION')
          assert all(x['home_probability'] is None and x['pick'] is None
                     and x['modal_scoreline'] is None for x in r['matches'] if x['status']=='ACTUAL')
          assert sum(x['Pts'] for x in r['league_table'])<=432
          assert len(r['scenario_bracket']['playoff'])==8
          assert len(r['scenario_bracket']['round_of_16'])==8
          assert len(r['scenario_bracket']['quarter_final'])==4
          assert len(r['scenario_bracket']['semi_final'])==2
          assert abs(sum(r['league_table'][i]['champion'] for i in range(36))-1)<.001
          print('Verified 144 fixtures, 36 teams, 6k simulations, 8+8+4+2+1 knockout path')
          PY
      - name: Historic Oct 13 outputs are immutable
        run: echo "No commit/push; current season updates are retained privately in the daily matchday snapshot ledger."
