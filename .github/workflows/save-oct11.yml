name: Save XGQ pre-match 11 October
on:
  push:
    branches: [main]
    paths: ['.github/workflows/save-oct11.yml']
permissions:
  contents: read
concurrency:
  group: form-xgq-online
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model
        run: python -m unittest discover -s tests -p 'test_prematch_ledger.py' -v
      - name: Store frozen 1X2 probabilities in private D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.prematch_ledger freeze
