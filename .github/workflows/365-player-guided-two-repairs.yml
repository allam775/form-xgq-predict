name: Resolve two original 365Scores extra shots with exact player statistics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/player_guided_repair365.py'
      - 'research/365_player_guided_two_repairs.py'
      - 'tests/test_365_player_guided_repair.py'
      - '.github/workflows/365-player-guided-two-repairs.yml'
permissions:
  contents: read
concurrency:
  group: 365scores-original-two-excess-player-proof
  cancel-in-progress: false
jobs:
  private-player-guided-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict multiple-shot disambiguation using actual player's xG
        run: python -m unittest discover -s tests -p 'test_365_player_guided_repair.py' -v
      - name: Reinspect only the two known ambiguous cases privately
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_player_guided_two_repairs
      - name: Enforce original audit immutability and no training or raw exposure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/365_player_guided_two_repairs.json').read_text())
          assert r['requests']<=r['request_cap']<=2
          assert r['training_release'] is False
          assert r['original_match_audits_changed'] is False
          assert r['individual_player_details_published'] is False
          assert r['raw_events_written'] is False
          assert r['private_match_rows_published']==0
          print('Player-guided shot exclusions require independent evidence')
          PY
      - name: Attach anonymized counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-two-player-guided-repairs-private
          path: research/reports/365_player_guided_two_repairs.json
          retention-days: 7
          if-no-files-found: warn
