name: One-time 365Scores source connectivity probe
on:
  push:
    branches:
      - fix/365-no-silent-match-omissions
permissions:
  contents: read
jobs:
  source-probe:
    if: github.repository == 'allam775/form-xgq-predict'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XGQ_365_ACCESS_AUTHORIZED: '1'
      XGQ_365_PRIVATE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe one authorized 365Scores calendar day, without bypasses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from engine import coverage365, provider365
          status={'source':'365Scores', 'competition_id':'572', 'day':'2026-10-13'}
          try:
              payload=provider365.fetch('games/allscores/', {'sports':'1','startDate':'13/10/2026','endDate':'13/10/2026','onlyMajorGames':'false','withTop':'false'})
              matches=coverage365._games(payload)
              cid=[g for g in matches if provider365._competition(g)[0]=='572']
              status.update({'status':'ok', 'all_games_reported':len(matches), 'competition_games_reported':len(cid)})
          except (HTTPError, URLError, provider365.AccessDenied, ValueError, TypeError, OSError) as exc:
              status.update({'status':'source_unavailable', 'error_kind':type(exc).__name__, 'message':str(exc)[:160]})
          q=lambda v: "'" + str(v).replace("'", "''") + "'"
          sql='INSERT INTO private_365_connection_probe(id,payload) VALUES ('+q('2026-10-14-branch-probe')+','+q(json.dumps(status,ensure_ascii=False))+') ON CONFLICT(id) DO UPDATE SET payload=excluded.payload;'
          with open('/tmp/365-connection-probe.sql','w',encoding='utf8') as f: f.write(sql+'\n')
          print('365Scores connectivity probe:',status['status'],'matching games:',status.get('competition_games_reported','unknown'))
          PY
      - name: Persist private probe result in Cloudflare D1
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --file /tmp/365-connection-probe.sql
          rm -f /tmp/365-connection-probe.sql
