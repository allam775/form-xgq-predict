name: One-time 365Scores source connectivity probe
on:
  push:
    branches:
      - fix/365-no-silent-match-omissions
permissions:
  contents: read
jobs:
  source-probe:
    if: github.repository == 'allam775/form-xgq-predict'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XGQ_365_ACCESS_AUTHORIZED: '1'
      XGQ_365_PRIVATE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe one authorized 365Scores calendar day, without bypasses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from engine import coverage365, provider365
          status={'source':'365Scores', 'competition_id':'572', 'day':'2026-10-13'}
          try:
              payload=provider365.fetch('games/allscores/', {'sports':'1','startDate':'13/10/2026','endDate':'13/10/2026','onlyMajorGames':'false','withTop':'false'})
              matches=coverage365._games(payload)
              cid=[g for g in matches if provider365._competition(g)[0]=='572']
              status.update({'status':'ok', 'all_games_reported':len(matches), 'competition_games_reported':len(cid)})
          except (HTTPError, URLError, provider365.AccessDenied, ValueError, TypeError, OSError) as exc:
              status.update({'status':'source_unavailable', 'error_kind':type(exc).__name__, 'message':str(exc)[:160]})
          q=lambda v: "'" + str(v).replace("'", "''") + "'"
          sql='INSERT INTO private_365_connection_probe(id,payload) VALUES ('+q('2026-10-14-branch-probe')+','+q(json.dumps(status,ensure_ascii=False))+') ON CONFLICT(id) DO UPDATE SET payload=excluded.payload;'
          with open('/tmp/365-connection-probe.sql','w',encoding='utf8') as f: f.write(sql+'\n')
          print('365Scores connectivity probe:',status['status'],'matching games:',status.get('competition_games_reported','unknown'))
          PY
      - name: Persist private probe result in Cloudflare D1
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --file /tmp/365-connection-probe.sql
          rm -f /tmp/365-connection-probe.sql
      - name: Restore existing UEFA catalog and staging rows privately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --json --command \
            "SELECT id,competition_id,league,fixture_date,status,payload FROM private_365_fixture_catalog WHERE competition_id='572'" > /tmp/365-uefa-matches.json
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --json --command \
            "SELECT id,competition_id,scan_date,scan_status,payload FROM private_365_coverage_days WHERE competition_id='572'" > /tmp/365-uefa-days.json
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --json --command \
            "SELECT id,payload FROM private_365_coverage_verified WHERE json_extract(payload,'$.league')='uefa.cl'" > /tmp/365-uefa-verified.json
          python -m engine.coverage365_d1 restore \
            --matches-input /tmp/365-uefa-matches.json --days-input /tmp/365-uefa-days.json \
            --verified-input /tmp/365-uefa-verified.json --competition-id 572 --league uefa.cl \
            --start 2026-07-01 --end 2027-06-30 --output data/private_365_catalog_live.json
      - name: Ingest all October 13 UEFA fixtures, without discarding unresolved xG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from engine import coverage365
          path=Path('data/private_365_catalog_live.json')
          ledger=json.loads(path.read_text(encoding='utf8'))
          count=coverage365.scan_day(ledger,'2026-10-13')
          coverage365._save_atomic(path,ledger)
          print('365 UEFA matched fixtures on 2026-10-13:', count)
          print('UEFA catalog game IDs after unique merge:',len(ledger['matches']))
          PY
          python -m engine.coverage365_d1 export \
            --input data/private_365_catalog_live.json --output /tmp/private-uefa-upserts.sql
          npx --yes wrangler@4 d1 execute xgq-predictions --remote \
            --file /tmp/private-uefa-upserts.sql
          rm -f /tmp/private-uefa-upserts.sql /tmp/365-uefa-matches.json /tmp/365-uefa-days.json \
            /tmp/365-uefa-verified.json data/private_365_catalog_live.json
