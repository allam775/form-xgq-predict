name: Privately verify 365Scores shot XGQ against all player statistics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/365_player_independent_release.py'
      - 'tests/test_365_player_independent_release.py'
      - '.github/workflows/365-player-independent-release.yml'
permissions:
  contents: read
jobs:
  certify-player-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline proof tests
        run: python -m unittest discover -s tests -p 'test_365_player_independent_release.py' -v
      - name: Store independently player-reconciled XGQ as a separate PRIVATE tier
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_player_independent_release
      - name: Ensure NO silent override of official team xG or model release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/365_player_independent_release.json').read_text())
          assert r['status']=='complete',r
          assert r['provider_requests']==0
          assert r['ordinary_fully_verified_archive_changed'] is False
          assert r['training_release'] is False
          assert r['raw_shot_events_exported'] is False
          assert r['private_match_rows_published']==0
          print('Alternate evidence tier is clearly separated from ordinary verified XGQ')
          PY
      - name: Upload aggregate-only evidence count
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-player-independent-alternative-tier
          path: research/reports/365_player_independent_release.json
          retention-days: 7
          if-no-files-found: warn
