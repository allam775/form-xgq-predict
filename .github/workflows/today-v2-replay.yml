name: Read-only Oct 17 current V2 retrospective test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/today_v2_replay.py'
      - 'tests/test_today_v2_replay.py'
      - '.github/workflows/today-v2-replay.yml'
permissions:
  contents: read
concurrency:
  group: penniless-oct17-v2-retroreplay
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical timestamp isolation, no frozen modification
        run: python -m unittest discover -s tests -p 'test_today_v2_replay.py' -v
      - name: Compute approved V2 for saved Oct 17 fixtures; store private report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.today_v2_replay
