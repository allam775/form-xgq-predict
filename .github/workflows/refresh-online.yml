name: Cloud-only XGQ research refresh

# Scheduled tasks run ON GITHUB'S HOSTED RUNNERS, not on the user's PC.
# Scheduled runs can be delayed; even a successful refresh does not mean
# StatsBomb offers recent per-shot data for every current competition.
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'site/**'
      - 'tests/**'
      - 'worker/**'
      - '.github/workflows/refresh-online.yml'
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write # needed only to persist real historical shot cache

concurrency:
  group: form-xgq-online
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and collector
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --check worker/index.js
          node tests/test_worker.mjs
      - name: Configure Cloudflare binding
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python scripts/configure_cloudflare.py
      - name: Initialize D1 schema remotely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 d1 execute xgq-predictions --remote --file migrations/0001_schema.sql --yes
      # Restore only when the explicit, rights-gated 365 connector is configured.
      # Query output goes to a runner-local file, never to Actions logs/artifacts.
      - name: Restore private D1 match history
        if: ${{ vars.XGQ_365_TEAMS_FILE != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.149.0 d1 execute xgq-predictions --remote --json --command "SELECT payload FROM private_shot_history ORDER BY id" > "$RUNNER_TEMP/private-history-query.json"
          python -m engine.private_history decode --input "$RUNNER_TEMP/private-history-query.json" --output data/private_365_history.json
      - name: Collect only freely published shot data and open fixtures
        env:
          XGQ_SHOT_FEED_URL: ${{ secrets.XGQ_SHOT_FEED_URL }}
          # Deliberately disabled by default. Public reuse needs appropriate permission.
          XGQ_365_ACCESS_AUTHORIZED: ${{ secrets.XGQ_365_ACCESS_AUTHORIZED }}
          XGQ_365_PUBLICATION_ALLOWED: ${{ secrets.XGQ_365_PUBLICATION_ALLOWED }}
          XGQ_365_PRIVATE_ONLY: ${{ secrets.XGQ_365_PRIVATE_ONLY }}
          XGQ_365_TEAMS_FILE: ${{ vars.XGQ_365_TEAMS_FILE }}
          XGQ_365_REQUIRE_PRIVATE_HISTORY: '1'
        run: |
          # Complete the published 2015/16 Italian and French cohorts, rather than
          # adding disconnected snippets. The cap avoids runaway downloads.
          for pass in 1 2 3 4; do
            echo "Coherent historical backfill pass: $pass"
            python -m engine.collect --max-new-matches 225 --target-history-size 1359 --max-open-seasons 6 --statsbomb-selections auto
            count=$(python -c "import json; h=json.load(open('data/shot_history.json')); print(sum(x.get('source') == 'StatsBomb Open Data' for x in h))")
            echo "Verified public shot history after pass $pass: $count / 1359"
            if [ "$count" -ge 1359 ]; then break; fi
          done
      - name: Show authentic shot archive progress
        run: |
          python -c "import json; h=json.load(open('data/shot_history.json')); n=len({r['id'] for r in h if r.get('source') == 'StatsBomb Open Data'}); print(f'Verified StatsBomb shot matches: {n} / 1359; remaining: {max(0, 1359-n)}')"
      - name: Run chronological XGQ benchmark (research only)
        run: python -m engine.research --input data/shot_history.json --output generated/research_report.json
      - name: Verify coverage and evidence publication gate
        run: |
          python -m engine.validate
          python -m engine.sql_export
      - name: Persist private 365 match history in D1
        if: ${{ vars.XGQ_365_TEAMS_FILE != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m engine.private_history export --input data/shot_history.json --output "$RUNNER_TEMP/private-shot-history.sql"
          npx --yes wrangler@4.149.0 d1 execute xgq-predictions --remote --file "$RUNNER_TEMP/private-shot-history.sql" --yes
      - name: Publish verified cloud snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 d1 execute xgq-predictions --remote --file generated/snapshot.sql --yes
      - name: Deploy UI and D1 API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy
      - name: Cache only authentic shot-level historical records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never commit 365Scores-derived rows in a PUBLIC GitHub repository.
          python scripts/sanitize_public_history.py
          # Research report here is computed AFTER stripping all third-party/private rows.
          mkdir -p reports
          python -m engine.research --input data/shot_history.json --output reports/open_data_benchmark.json
          python -m engine.archive_quality --input data/shot_history.json --output reports/open_data_archive_quality.json
          git add data/shot_history.json reports/open_data_benchmark.json reports/open_data_archive_quality.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh licensed shot history'
            git push
          fi
