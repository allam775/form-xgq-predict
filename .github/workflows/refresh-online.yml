name: Cloud-only XGQ research refresh

# Scheduled tasks run ON GITHUB'S HOSTED RUNNERS, not on the user's PC.
# Scheduled runs can be delayed; even a successful refresh does not mean
# StatsBomb offers recent per-shot data for every current competition.
on:
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write # needed only to persist real historical shot cache

concurrency:
  group: form-xgq-online
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and collector
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --check worker/index.js
          node tests/test_worker.mjs
      - name: Collect only freely published shot data and open fixtures
        env:
          XGQ_SHOT_FEED_URL: ${{ secrets.XGQ_SHOT_FEED_URL }}
          # Deliberately disabled by default. Public reuse needs appropriate permission.
          XGQ_365_ACCESS_AUTHORIZED: ${{ secrets.XGQ_365_ACCESS_AUTHORIZED }}
          XGQ_365_PUBLICATION_ALLOWED: ${{ secrets.XGQ_365_PUBLICATION_ALLOWED }}
          XGQ_365_PRIVATE_ONLY: ${{ secrets.XGQ_365_PRIVATE_ONLY }}
          XGQ_365_TEAMS_FILE: ${{ vars.XGQ_365_TEAMS_FILE }}
        run: python -m engine.collect --max-new-matches 50 --statsbomb-selections auto
      - name: Verify coverage and evidence publication gate
        run: |
          python -m engine.validate
          python -m engine.sql_export
      - name: Configure Cloudflare binding
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python scripts/configure_cloudflare.py
      - name: Initialize D1 schema remotely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 d1 execute xgq-predictions --remote --file migrations/0001_schema.sql --yes
      - name: Publish verified cloud snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 d1 execute xgq-predictions --remote --file generated/snapshot.sql --yes
      - name: Deploy UI and D1 API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy
      - name: Cache only authentic shot-level historical records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never commit 365Scores-derived rows in a PUBLIC GitHub repository.
          python scripts/sanitize_public_history.py
          git add data/shot_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh licensed shot history'
            git push
          fi
