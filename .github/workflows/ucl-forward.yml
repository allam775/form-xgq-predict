name: Penniless UEFA Champions League prospective separate model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/ucl_forward.py'
      - 'research/ucl2026_27_verified_results.json'
      - 'tests/test_ucl_forward.py'
      - 'research/ucl_2026_27.py'
      - '.github/workflows/ucl-forward.yml'
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: read
concurrency:
  group: penniless-uefa-forward-2026
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check UEFA official fixtures, correct history cutoff and frozen score-file immutability
        run: python -m unittest discover -s tests -p 'test_ucl_forward.py' -v
      - name: Grade October 20 using October 13 actual published fixture predictions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m research.ucl_forward oct20-audit
      - name: Freeze NEW genuine pre-match UEFA 1X2 forecasts separately
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m research.ucl_forward freeze
      - name: Grade only officially verified prior UCL outcomes; no retrospective labels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m research.ucl_forward grade
