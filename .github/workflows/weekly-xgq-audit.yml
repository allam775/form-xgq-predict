name: Private weekly XGQ skill and calibration audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-xgq-audit.yml'
  schedule:
    # Each Sunday at 10:11 Egypt (UTC+3), subject to GitHub schedule delays.
    - cron: '11 7 * * 0'

permissions:
  contents: read

# Avoid overlapping reads/writes with private Understat historical backfill.
concurrency:
  group: form-xgq-online
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline chronological benchmark regression suite
        run: |
          python -m unittest discover -s tests -p 'test_understat_championship.py' -v
          python -m unittest discover -s tests -v
      - name: Compare only prior-match forecasts against same-fixture baselines in private D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.understat_championship
