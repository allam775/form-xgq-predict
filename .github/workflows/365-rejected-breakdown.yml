name: Examine eleven rejected 365Scores shot categories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/365-rejected-breakdown.yml'
permissions:
  contents: read
concurrency:
  group: 365scores-rejected-category-breakdown
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regressions
        run: |
          python -m py_compile research/365_rejected_stat_breakdown.py
          python -m unittest discover -s tests -p 'test_365_rejected_stat_breakdown.py' -v
      - name: One documented stats request per rejected match only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_rejected_stat_breakdown
      - name: Audit privacy and request cap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/365_rejected_stat_breakdown_summary.json').read_text())
          assert r['rejected_cases']==11 and r['requests']<=11
          assert r['raw_shots_written']==0 and r['public_private_rows']==0
          assert r['old_verification_modified'] is False
          print('PASS: no private shot payloads or false verified matches')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 365scores-private-breakdown-summary
          path: research/reports/365_rejected_stat_breakdown_summary.json
          if-no-files-found: warn
          retention-days: 3
