name: Private last-30-day Stage 1 vs Stage 3 comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/last30_compare.py'
      - 'tests/test_last30_compare.py'
      - '.github/workflows/last30-compare.yml'
permissions:
  contents: read
concurrency:
  group: form-xgq-last30-replay
  cancel-in-progress: false
jobs:
  monthly-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm chronological paired comparison and frozen-source safety
        run: python -m unittest discover -s tests -p 'test_last30_compare.py' -v
      - name: Replay completed 30 days on actual verified history and save only aggregate report in private D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.last30_compare
