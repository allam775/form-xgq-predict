name: Verify full 365Scores shot histories against independent match statistics
on:
  workflow_dispatch:
  schedule:
    # Run after Saturday's separately scheduled private match discovery.
    - cron: '25 8 * * 6'
permissions:
  contents: read
concurrency:
  group: 365scores-full-shot-verifier
  cancel-in-progress: false
jobs:
  full-shot-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test independent total-shots and xG reconciliation
        run: |
          python -m unittest discover -s tests -p 'test_365_stats_completeness.py' -v
          python -m unittest discover -s tests -p 'test_365_stats_completeness_batch.py' -v
      - name: Crosscheck real private candidates with real 365Scores game/stats full-match data
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_stats_completeness_batch
      - name: Fail if public audit contains per-match shots or inferred xGQ
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/reports/365_stats_completeness_batch.json").read_text())
          assert r["raw_events_written"]==0
          assert r["public_private_match_rows"]==0
          assert r["production_predictions_changed"] is False
          assert r["stats_requests"]<=r["request_cap"]<=18
          assert "matches" not in r and "match_ids" not in r
          print("Verified privacy limits and fail-closed shot completeness checks")
          PY
      - name: Upload aggregate research summary (no private provider values)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-full-shot-validation-summary
          path: research/reports/365_stats_completeness_batch.json
          retention-days: 7
          if-no-files-found: warn
