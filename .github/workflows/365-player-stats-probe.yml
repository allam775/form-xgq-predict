name: Diagnose original XGQ 365Scores player shot and xG fields
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/365_player_stat_schema_probe.py'
      - 'tests/test_365_player_stat_schema_probe.py'
      - '.github/workflows/365-player-stats-probe.yml'
permissions:
  contents: read
concurrency:
  group: 365scores-player-stats-one-match
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline safety and schema validation
        run: python -m unittest discover -s tests -p 'test_365_player_stat_schema_probe.py' -v
      - name: Inspect one originally rejected match privately
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_player_stat_schema_probe
      - name: Assert public result has no private match/player information
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/reports/365_player_stat_schema.json").read_text())
          assert r["provider_requests"]<=1
          assert r["match_promotions"]==0
          assert r["player_identifiers_published"]==0
          assert r["individual_player_stats_published"]==0
          assert r["match_identifiers_published"]==0
          assert r["raw_events_published"]==0
          PY
      - name: Publish aggregate field taxonomy only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-player-stat-field-taxonomy
          path: research/reports/365_player_stat_schema.json
          retention-days: 2
          if-no-files-found: warn
