name: Verify 365Scores coverage ledger

on:
  pull_request:
    paths:
      - 'engine/coverage365.py'
      - 'engine/coverage365_d1.py'
      - 'engine/provider365.py'
      - 'tests/test_coverage365.py'
      - 'tests/test_coverage365_d1.py'
      - 'tests/test_provider365.py'
      - '.github/workflows/365-coverage-tests.yml'
  workflow_dispatch:

jobs:
  offline-coverage-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check private backfill configuration (booleans only)
        env:
          HAS_CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          RIGHTS_SET: ${{ (vars.XGQ_365_ACCESS_AUTHORIZED || secrets.XGQ_365_ACCESS_AUTHORIZED) == '1' }}
          PRIVATE_SET: ${{ (vars.XGQ_365_PRIVATE_ONLY || secrets.XGQ_365_PRIVATE_ONLY) == '1' }}
        run: |
          echo "Cloudflare credentials configured: $HAS_CF_ID / $HAS_CF_TOKEN"
          echo "365 source rights flag configured: $RIGHTS_SET"
          echo "Private deployment flag configured: $PRIVATE_SET"
      - name: Run provider and coverage tests without calling 365Scores
        run: |
          python -m unittest discover -s tests -p 'test_provider365.py' -v
          python -m unittest discover -s tests -p 'test_coverage365.py' -v
          python -m unittest discover -s tests -p 'test_coverage365_d1.py' -v
