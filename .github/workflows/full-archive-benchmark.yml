name: Full Understat archive paired model and draw picks audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/full_archive_benchmark.py'
      - 'tests/test_full_archive_benchmark.py'
      - '.github/workflows/full-archive-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: penniless-understat-full-archive
  cancel-in-progress: false
jobs:
  all-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit draw definitions and strict cutoff
        run: python -m unittest discover -s tests -p 'test_full_archive_benchmark.py' -v
      - name: Historical comparison of every eligible Understat match and all model draw picks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.full_archive_benchmark
