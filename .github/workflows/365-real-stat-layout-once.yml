name: Private 365Scores stats structure probe
on:
  push:
    branches:
      - fix/365-real-stat-layout
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'allam775/form-xgq-predict'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect already verified game ID without persisting raw events
        run: |
          python - <<'PY'
          import json
          from engine import provider365
          shapes={}
          for label,path,params in [('stats','game/stats/',{'games':'4828476'}),('game','game/',{'gameId':'4828476'})]:
              try:
                  payload=provider365.fetch(path,params)
                  items=[]
                  def walk(node,loc='root',depth=0):
                      if depth>5 or len(items)>70: return
                      if isinstance(node,dict):
                          ent={'path':loc,'keys':list(node.keys())[:40]}
                          if any(k in node for k in ('name','title','label','statName','key')):
                              ent['label']=str(next((node[k] for k in ('name','title','label','statName','key') if k in node),''))[:70]
                          items.append(ent)
                          for k,v in node.items():
                              if isinstance(v,(dict,list)):walk(v,loc+'.'+k,depth+1)
                      elif isinstance(node,list):
                          for i,v in enumerate(node[:2]):walk(v,loc+'['+str(i)+']',depth+1)
                  walk(payload)
                  shapes[label]={'status':'ok','layout':items}
              except Exception as exc:
                  shapes[label]={'status':'error','kind':type(exc).__name__,'message':str(exc)[:140]}
          q=lambda v:"'"+str(v).replace("'","''")+"'"
          sql="INSERT INTO private_365_connection_probe(id,payload) VALUES ("+q('stats-layout-4828476')+","+q(json.dumps(shapes))+ ") ON CONFLICT(id) DO UPDATE SET payload=excluded.payload;"
          open('/tmp/private-stats-layout.sql','w').write(sql+'\n')
          print('Source layouts:',{k:v['status'] for k,v in shapes.items()})
          PY
      - name: Save schema-only diagnostics privately
        run: npx --yes wrangler@4 d1 execute xgq-predictions --remote --file /tmp/private-stats-layout.sql
      - name: Restore UEFA research catalog and inspect actual per-shot xG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --json --command \
            "SELECT id,competition_id,league,fixture_date,status,payload FROM private_365_fixture_catalog WHERE competition_id='572'" > /tmp/m.json
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --json --command \
            "SELECT id,competition_id,scan_date,scan_status,payload FROM private_365_coverage_days WHERE competition_id='572'" > /tmp/d.json
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --json --command \
            "SELECT id,payload FROM private_365_coverage_verified WHERE json_extract(payload,'$.league')='uefa.cl'" > /tmp/v.json
          python -m engine.coverage365_d1 restore \
            --matches-input /tmp/m.json --days-input /tmp/d.json --verified-input /tmp/v.json \
            --competition-id 572 --league uefa.cl --start 2026-07-01 --end 2027-06-30 \
            --output data/private_365_catalog_live.json
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from engine import coverage365
          target=Path('data/private_365_catalog_live.json')
          ledger=json.loads(target.read_text(encoding='utf8'))
          checked=coverage365.refresh_details(ledger, limit=12)
          coverage365._save_atomic(target,ledger)
          print('Live 365Scores details inspected:',checked)
          print('Research only statuses:',dict(Counter(x.get('xg_status') for x in ledger['matches'].values())))
          PY
          python -m engine.coverage365_d1 export --input data/private_365_catalog_live.json --output /tmp/private-uefa-stats-upsert.sql
          npx --yes wrangler@4 d1 execute xgq-predictions --remote --file /tmp/private-uefa-stats-upsert.sql
          rm -f /tmp/m.json /tmp/d.json /tmp/v.json /tmp/private-uefa-stats-upsert.sql data/private_365_catalog_live.json
