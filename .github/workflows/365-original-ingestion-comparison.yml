name: Compare original XGQ 365Scores extraction for eight unresolved matches
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 365-original-eight-only
  cancel-in-progress: false
jobs:
  legacy-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original-source comparison and strict shot validity offline
        run: python -m unittest discover -s tests -p 'test_365_original_ingestion_comparison.py' -v
      - name: Compare exactly 8 original rejected matches privately
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_original_ingestion_comparison
      - name: Assert no raw provider data or training changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/reports/365_original_ingestion_comparison.json").read_text())
          assert r["cases"]==8 and r["calls"]<=16
          assert r["no_verified_change"] is True
          assert r["training_changed"] is False
          assert r["provider_payloads_published"] is False
          assert r["per_match_provider_data_public"] is False
          assert "matches" not in r and "shot_values" not in r
          print("Private comparison and bounded provider requests confirmed")
          PY
      - name: Attach only aggregate diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-xgq-eight-match-comparison
          path: research/reports/365_original_ingestion_comparison.json
          retention-days: 7
          if-no-files-found: warn
