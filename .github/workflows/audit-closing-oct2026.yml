name: Audit actual archived closing odds 23-25 October 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/closing_recent_five.py'
      - '.github/workflows/audit-closing-oct2026.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check identical verified fixtures against archival 2026-27 1X2 bookmaker closing odds
        run: python -m research.closing_recent_five
