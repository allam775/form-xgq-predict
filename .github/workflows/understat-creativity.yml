name: Understat private creativity enrichment and phase 2 evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/understat_creativity.py'
      - 'engine/stage2_research.py'
      - 'tests/test_understat_creativity.py'
      - 'tests/test_stage2_research.py'
      - '.github/workflows/understat-creativity.yml'
  schedule:
    # Resumable, bounded enrichment of historical MATCH rosters into private D1.
    - cron: '23 2,10,18 * * *'
permissions:
  contents: read
concurrency:
  group: form-xgq-creativity
  cancel-in-progress: false
jobs:
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate real match xA and Key Passes schemas
        run: |
          python -m unittest discover -s tests -p 'test_understat_creativity.py' -v
          python -m unittest discover -s tests -p 'test_stage2_research.py' -v
          python -m py_compile engine/stage2_research.py
      - name: Enrich 100 existing verified Understat matches per pass
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.understat_creativity --max-new 100 --pause 1.2
      - name: Phase 2 same-fixture comparison against baseline models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.stage2_research
