name: Safe live-refresh regressions
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: ['fix/**']
    paths:
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live feed regressions and archive safeguards
        run: |
          python -m unittest discover -s tests -p 'test_live_refresh_regressions.py' -v
          python -m unittest discover -s tests -p 'test_understat_backfill.py' -v
          python -m unittest discover -s tests -p 'test_daily_forecast.py' -v
      - name: Full offline Python regression suite
        run: python -m unittest discover -s tests -v
