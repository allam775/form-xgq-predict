name: Private staged football feature research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/feature_ladder.py'
      - 'tests/test_feature_ladder.py'
      - '.github/workflows/feature-ladder.yml'
permissions:
  contents: read
concurrency:
  group: form-xgq-feature-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stage-1 chronology and model validity
        run: |
          python -m unittest discover -s tests -p 'test_feature_ladder.py' -v
      - name: Benchmark stage 1 against the five league baselines
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.feature_ladder
