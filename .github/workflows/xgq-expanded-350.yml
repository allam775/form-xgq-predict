name: XGQ expanded 350-match private audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xgq-expanded-350.yml'

permissions:
  contents: read

# Never overlap D1 reads/writes with the authenticated source backfill.
concurrency:
  group: form-xgq-online
  cancel-in-progress: false

jobs:
  expanded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline extended chronological audit and source separation
        run: |
          python -m unittest discover -s tests -p 'test_understat_championship.py' -v
          python -m unittest discover -s tests -p 'test_understat_hybrid.py' -v
      - name: Audit at least 350 historically eligible matches from private Understat data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.understat_championship --expanded-350
