name: Recheck one 365Scores original chart against current full player totals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/365_player_current_version_check.py'
      - 'tests/test_365_player_current_version_check.py'
      - '.github/workflows/365-player-current-check.yml'
permissions:
  contents: read
concurrency:
  group: 365scores-player-current-chart-evidence
  cancel-in-progress: false
jobs:
  one-private-current-player-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no aggregate XGQ substitution
        run: python -m unittest discover -s tests -p 'test_365_player_current_version_check.py' -v
      - name: Re-fetch exactly one known original-vs-current chart conflict
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_player_current_version_check
      - name: Enforce evidence segregation and no training
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/365_player_current_version_check.json').read_text())
          assert r['provider_requests']<=1
          assert r['training_release'] is False
          assert r['official_team_xg_disagreement_preserved'] is True
          assert r['original_candidates_mutated'] is False
          assert r['original_rejection_audits_mutated'] is False
          assert r['public_player_identifiers'] is False
          assert r['raw_shots_written'] is False
          assert r['private_match_rows_published']==0
          print('Current chart witnessed independently by players; original audit retained')
          PY
      - name: Upload only counts, never individual XGQ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-current-player-evidence-check
          path: research/reports/365_player_current_version_check.json
          retention-days: 7
          if-no-files-found: warn
