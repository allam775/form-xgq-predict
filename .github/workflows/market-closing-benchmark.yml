name: Retrospective commercial-market same-fixture 1X2 benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/market_closing_benchmark.py'
      - 'tests/test_market_closing_benchmark.py'
      - '.github/workflows/market-closing-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: penniless-market-matched-archive
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict identity joins and de-vig probability math
        run: python -m unittest discover -s tests -p 'test_market_closing_benchmark.py' -v
      - name: Compare independent market probabilities versus Penniless on exactly matching verified fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.market_closing_benchmark
