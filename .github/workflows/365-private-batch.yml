name: 365Scores private verified-competition candidate collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/365_private_batch.py'
      - 'engine/competition365.py'
      - 'engine/provider365.py'
      - 'tests/test_365_competition_identity.py'
      - 'tests/test_365_private_batch.py'
      - '.github/workflows/365-private-batch.yml'
  schedule:
    - cron: '37 7 * * 6'
permissions:
  contents: read
concurrency:
  group: 365scores-private-candidate-collection
  cancel-in-progress: false
jobs:
  private-candidate-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check competition ID and privacy/completeness gates offline
        run: |
          python -m unittest discover -s tests -p 'test_365_competition_identity.py' -v
          python -m unittest discover -s tests -p 'test_365_private_batch.py' -v
          python -m unittest discover -s tests -p 'test_provider365.py' -v
      - name: Collect bounded owner-authorized real 365Scores matches to private D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m research.365_private_batch
      - name: Verify diagnostic contains no private match rows, raw shots or credentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('research/reports/365_private_batch_status.json').read_text())
          assert v['requests']<=v['request_cap']<=15
          assert v['accepted_complete_xgq']==0
          assert v['raw_provider_payloads_stored']==0
          assert v['published_private_match_rows']==0
          assert 'matches' not in v and 'details' not in v
          print('OK: bounded private candidate collection; no false complete XGQ claim')
          PY
      - name: Upload aggregate diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-private-batch-safe-status
          path: research/reports/365_private_batch_status.json
          retention-days: 7
          if-no-files-found: warn
