name: Penniless comprehensive historical and 2026-27 season validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/comprehensive.py'
      - 'tests/test_comprehensive.py'
      - '.github/workflows/comprehensive-compare.yml'
permissions:
  contents: read
concurrency:
  group: penniless-comprehensive-backtest
  cancel-in-progress: false
jobs:
  paired-comprehensive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression-test same-day safety, model calibration, and frozen parameters
        run: python -m unittest discover -s tests -p 'test_comprehensive.py' -v
      - name: Compare all models on historical holdout and current season in private D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.comprehensive
