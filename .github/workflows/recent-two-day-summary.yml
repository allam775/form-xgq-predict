name: Penniless October 19-20 frozen model scoreboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/recent_two_day_summary.py'
      - 'tests/test_recent_two_day_summary.py'
      - '.github/workflows/recent-two-day-summary.yml'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen-ledger result counting
        run: python -m unittest discover -s tests -p 'test_recent_two_day_summary.py' -v
      - name: Report all models by match date on verified results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.recent_two_day_summary
