name: Reconcile exactly five extra-chart-shot 365Scores cases
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/365-extra-event-repair.yml'
      - 'engine/repair365.py'
      - 'tests/test_365_extra_event_repair.py'
permissions:
  contents: read
concurrency:
  group: 365scores-five-original-extra-event-cases
  cancel-in-progress: false
jobs:
  repair-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test mathematically unique shot-removal condition with synthetic controls
        run: |
          python -m py_compile engine/repair365.py research/365_excess_event_repair.py
          python -m unittest discover -s tests -p 'test_365_extra_event_repair.py' -v
      - name: Check five rejected known match IDs against original details and independently stored stats
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_excess_event_repair
      - name: Enforce no private match data in public result, no production model changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/reports/365_excess_event_repair_summary.json').read_text())
          assert r['original_cases']==5
          assert r['details_requested']<=5 and r['raw_events_written']==0
          assert r['published_private_match_details']==0
          assert r['verified_original_audit_rows_changed']==0 and r['model_changed'] is False
          print('Strict reconciliation safety gates passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 365scores-private-single-excess-shot-repair-counts
          path: research/reports/365_excess_event_repair_summary.json
          if-no-files-found: warn
          retention-days: 3
