name: Diagnose 365Scores match statistics completeness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/365_stats_schema_probe.py'
      - 'tests/test_365_stats_schema_probe.py'
      - '.github/workflows/365-stats-schema.yml'
permissions:
  contents: read
concurrency:
  group: 365scores-statistics-one-match
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove no raw event/statistic value published
        run: python -m unittest discover -s tests -p 'test_365_stats_schema_probe.py' -v
      - name: One owner-authorized match statistics request
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m research.365_stats_schema_probe
      - name: Attach ONLY taxonomy (no raw provider values)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 365scores-statistics-schema
          path: research/reports/365_stats_schema_audit.json
          if-no-files-found: warn
          retention-days: 2
