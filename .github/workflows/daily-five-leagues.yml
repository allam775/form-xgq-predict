name: Private daily five-league XGQ pre-match forecasts

# Every four hours, including weekends. Hosted by GitHub, no local computer.
# Looks 48 hours ahead to reduce exposure to delayed scheduled runners.
# Predictions are frozen once per verified provider fixture; results can only
# be graded after the match and never rewrite the original prediction.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/daily_forecast.py'
      - 'engine/comprehensive.py'
      - 'engine/stage3_form.py'
      - 'engine/forward_shadow.py'
      - 'tests/test_forward_shadow.py'
      - 'tests/test_daily_forecast.py'
      - '.github/workflows/daily-five-leagues.yml'
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'

permissions:
  contents: read

concurrency:
  group: form-xgq-daily-forecasts
  cancel-in-progress: false

jobs:
  daily-forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify daily pre-match and immutability regressions
        run: |
          python -m unittest discover -s tests -p 'test_daily_forecast.py' -v
          python -m unittest discover -s tests -p 'test_forward_shadow.py' -v
          python -m unittest discover -s tests -p 'test_prematch_ledger.py' -v
      - name: Grade any subsequently verified final results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.daily_forecast grade
      - name: Freeze new verified-source fixtures before kickoff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.daily_forecast freeze
      - name: Audit forward model competition (fixed DC baseline vs production XGQ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m engine.forward_shadow
